<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng AI 3D</title>
<link rel="icon" href="/logo/xuong_64.png">
<!-- Xuong lam viec 3D (Three.js MIT, ky thuat PhongCanh3D): moi kenh mot phong, moi subagent mot nhan vien di lai.
     Ban de chieu man hinh: luon an danh, khong hien noi dung cong viec / lenh / nhat ky. -->
<script type="importmap">
  { "imports": { "three": "/3d/lib/three.module.js", "three/addons/": "/3d/lib/addons/" } }
</script>
<style>
  /* Cyber-SaaS glass 2.0: lop HUD noi tren sa ban 3D */
  :root { --ink:#f1f5f9; --dim:rgba(226,232,240,.62); --panel:rgba(15,23,42,.76); --line:rgba(255,255,255,.08);
    --run:#22c55e; --wait:#f59e0b; --done:#60a5fa; --err:#f87171; --ghost:#a78bfa; --acc:#f59e0b; --acc2:#d97706;
    --r:18px; --gap:16px; --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; color:var(--ink);
    font:13px/1.45 -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  #c { position:fixed; inset:0; display:block; outline:none; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .glass { background:var(--panel); backdrop-filter:blur(16px) saturate(1.8); -webkit-backdrop-filter:blur(16px) saturate(1.8);
    border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  button { font:inherit; color:inherit; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px;
    padding:5px 11px; cursor:pointer; transition:background .15s, border-color .15s, transform .15s, box-shadow .15s; white-space:nowrap; }
  button:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.18); }
  button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button.on { background:rgba(245,158,11,.16); border-color:rgba(245,158,11,.55); color:#fde7c2; }
  button.pri { background:linear-gradient(135deg, var(--acc), var(--acc2)); border-color:rgba(255,255,255,.18); color:#1c1306; font-weight:650;
    box-shadow:0 4px 14px rgba(217,119,6,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  button.pri:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(217,119,6,.45), inset 0 1px 0 rgba(255,255,255,.35); background:linear-gradient(135deg, #fbbf24, var(--acc)); }
  button.pri.on { background:linear-gradient(135deg, #ef4444, #b91c1c); color:#fff; }
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
  button.ghost:hover { background:rgba(255,255,255,.08); color:var(--ink); }
  a { color:inherit; }
  kbd { display:inline-block; min-width:18px; padding:0 5px; border-radius:6px; border:1px solid rgba(255,255,255,.16); border-bottom-width:2px;
    background:rgba(255,255,255,.06); font:600 10.5px/16px ui-monospace, Menlo, monospace; text-align:center; color:var(--ink); }

  /* thanh tren: vien nang noi */
  #top { position:fixed; z-index:3; left:var(--gap); right:var(--gap); top:14px; display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap;
    padding:7px 10px 7px 12px; border-radius:20px; transition:opacity .25s, transform .25s; }
  #top img.brand { width:30px; height:30px; border-radius:50%; box-shadow:0 0 0 2px rgba(245,158,11,.5); }
  #top h1 { font-size:14.5px; font-weight:700; letter-spacing:.01em; margin-right:2px; white-space:nowrap; }
  #top .sp { flex:1; }
  #top .grp { display:flex; gap:4px; align-items:center; padding:2px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--line); }
  #top .grp button { border-color:transparent; background:transparent; padding:4px 9px; }
  #top .grp button:hover { background:rgba(255,255,255,.1); }
  .stat { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .mp { display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px; background:rgba(255,255,255,.05);
    border:1px solid var(--line); color:var(--dim); font-size:12px; white-space:nowrap; }
  .mp b { color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }
  .mp .g { width:8px; height:8px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 10px var(--c); }
  .mp.live .g { animation:nhay 1.8s ease-in-out infinite; }
  .mp.time { background:transparent; border-color:transparent; padding-left:2px; }
  @keyframes nhay { 50% { box-shadow:0 0 0 5px color-mix(in srgb, var(--c) 10%, transparent), 0 0 16px var(--c); } }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  #led { width:8px; height:8px; border-radius:50%; background:#555; flex:none; }
  #led.on { background:var(--run); box-shadow:0 0 8px var(--run); }
  #led.off { background:var(--err); }

  /* che do Zen: an toan bo HUD 2D, chi con nut hien lai */
  #zenOut { position:fixed; z-index:5; right:var(--gap); top:14px; display:none; width:38px; height:38px; border-radius:50%; padding:0; font-size:16px; }
  body.zen #top, body.zen #rooms, body.zen #feed, body.zen #hint, body.zen #pf { opacity:0; pointer-events:none; }
  body.zen #top { transform:translateY(-12px); } body.zen #rooms { transform:translateX(-12px); } body.zen #feed, body.zen #hint { transform:translateY(12px); }
  body.zen #zenOut { display:grid; place-items:center; }
  /* tour dien anh: an HUD, 2 dai den kieu man anh rong, man den ngan khi chuyen canh */
  body.cine #top, body.cine #rooms, body.cine #feed, body.cine #hint, body.cine #pf, body.cine #labels { opacity:0; pointer-events:none; }
  #cineBar { position:fixed; inset:0; z-index:4; pointer-events:none; }
  #cineBar::before, #cineBar::after { content:""; position:absolute; left:0; right:0; height:0; background:#000; transition:height .6s ease; }
  #cineBar::before { top:0; } #cineBar::after { bottom:0; }
  body.cine #cineBar::before, body.cine #cineBar::after { height:9vh; }
  #cineFade { position:fixed; inset:0; z-index:4; background:#000; opacity:0; pointer-events:none; transition:opacity .45s ease; }
  #cineFade.on { opacity:1; transition:none; }

  /* danh sach phong: thu gon thanh cot icon, re chuot / ghim de mo rong */
  #rooms { position:fixed; left:var(--gap); top:calc(var(--topH, 54px) + 26px); display:flex; flex-direction:column; gap:2px; z-index:2; padding:6px;
    max-height:calc(100% - var(--topH, 54px) - 270px); overflow:hidden auto; scrollbar-width:none; width:296px;
    transition:width .25s cubic-bezier(.2,.8,.2,1), opacity .25s, transform .25s; }
  #rooms::-webkit-scrollbar { display:none; }
  #rooms .rh { display:flex; align-items:center; gap:6px; padding:2px 2px 6px 8px; color:var(--dim); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
  #rooms .rh button { margin-left:auto; padding:2px 7px; font-size:12px; }
  #rooms button.r { text-align:left; display:flex; gap:9px; align-items:center; border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:11px; position:relative; }
  #rooms button.r:hover { background:rgba(255,255,255,.07); }
  #rooms button.r.on { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.45); box-shadow:inset 3px 0 0 var(--acc), 0 0 18px rgba(245,158,11,.15); }
  #rooms .e { position:relative; width:22px; text-align:center; font-size:15px; flex:none; }
  #rooms .e i { position:absolute; right:-3px; bottom:-1px; width:8px; height:8px; border-radius:50%; background:var(--c, transparent); box-shadow:0 0 0 2px rgba(15,23,42,.9), 0 0 8px var(--c, transparent); }
  #rooms .t { overflow:hidden; text-overflow:ellipsis; transition:opacity .2s; }
  #rooms .n { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; padding-left:8px; font-size:12px; }
  #rooms .k { order:9; color:var(--dim); font-size:10px; }
  #rooms .k:not(:empty) { border:1px solid rgba(255,255,255,.14); border-radius:5px; padding:0 4px; }
  #rooms .khoa { opacity:.5; font-size:11px; padding:0 2px; border-radius:4px; }
  #rooms .khoa:hover { opacity:1; background:rgba(255,255,255,.15); }
  #rooms .khoa.cho { opacity:.9; filter:grayscale(1); }
  #rooms button.dong { color:var(--dim); } #rooms button.dong .e { filter:grayscale(1); opacity:.6; }
  #rooms.thu:not(:hover) { width:52px; }
  #rooms.thu:not(:hover) .t, #rooms.thu:not(:hover) .n, #rooms.thu:not(:hover) .k, #rooms.thu:not(:hover) .khoa, #rooms.thu:not(:hover) .rh span { opacity:0; pointer-events:none; }
  #rooms.thu:not(:hover) .rh { justify-content:center; padding-left:2px; } #rooms.thu:not(:hover) .rh button { margin:0; }

  /* bang tin: dong thong bao */
  #feed { position:fixed; left:var(--gap); bottom:var(--gap); width:min(400px, calc(100% - 32px)); padding:10px 10px 6px; transition:opacity .25s, transform .25s; }
  #feed .h { display:flex; align-items:center; gap:6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 4px 4px; }
  #feed .h::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--run); box-shadow:0 0 8px var(--run); }
  #feedList { max-height:186px; overflow:hidden; -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%); padding:4px 0 10px; }
  .fi { display:flex; gap:9px; align-items:center; padding:4px 6px; cursor:pointer; border-radius:10px; }
  .fi:hover { background:rgba(255,255,255,.06); }
  .fi.new { animation:fin .5s ease; }
  .fi img { width:26px; height:26px; border-radius:50%; flex:none; background:#333; box-shadow:0 0 0 2px var(--rc, #64748b); }
  .fi .x, .fi .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .fi .x b { font-weight:650; }
  .fi .t { color:var(--dim); font-variant-numeric:tabular-nums; flex:none; font-size:11px; opacity:.75; }
  .bdg { display:inline-block; margin-left:4px; padding:0 7px; border-radius:999px; font-size:11px; line-height:18px; background:rgba(255,255,255,.08); color:#e2e8f0; }
  .bdg.lenh { background:rgba(196,181,253,.16); color:#ddd6fe; } .bdg.bc { background:rgba(45,212,191,.16); color:#99f6e4; }
  .bdg.loi { background:rgba(248,113,113,.18); color:#fecaca; } .bdg.giao { background:rgba(245,158,11,.18); color:#fde68a; }
  .bdg.web { background:rgba(96,165,250,.16); color:#bfdbfe; } .bdg.doc { background:rgba(148,163,184,.16); color:#e2e8f0; }
  .bdg.viet { background:rgba(244,114,182,.15); color:#fbcfe8; }
  @keyframes fin { from { opacity:0; transform:translateY(-6px); } }

  /* goi y phim tat: chip, tu mo sau 5 giay */
  #hint { position:fixed; right:var(--gap); bottom:var(--gap); padding:7px 10px; color:var(--dim); font-size:11.5px; max-width:calc(100% - 450px);
    display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; transition:opacity .6s, transform .25s; border-radius:14px; }
  #hint span { white-space:nowrap; } #hint.mo { opacity:.6; } #hint:hover { opacity:1; }

  /* nhan tren dau nhan vien */
  .lbl { pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .lbl .card { display:flex; align-items:center; gap:5px; padding:2px 8px 2px 2px; border-radius:999px; background:rgba(18,20,26,.78);
    border:1px solid rgba(255,255,255,.14); white-space:nowrap; font-size:11.5px; font-weight:600; transition:transform .15s; }
  .lbl:hover .card { transform:scale(1.08); }
  .lbl img { width:22px; height:22px; border-radius:50%; border:2px solid var(--c, #888); background:#2a2a2a; object-fit:cover; }
  .lbl .act { max-width:220px; padding:3px 8px; border-radius:8px; background:rgba(255,255,255,.92); color:#1d1f24; font-size:11px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:none; position:relative; }
  .lbl .act::after { content:""; position:absolute; left:50%; bottom:-4px; margin-left:-4px; border:4px solid transparent; border-bottom:0; border-top-color:rgba(255,255,255,.92); }
  .lbl.near .act, .lbl:hover .act, .lbl.sel .act, .lbl.talk .act { display:block; }
  .lbl.talk .act { white-space:normal; max-width:200px; text-align:center; animation:noi .25s ease-out; }
  .lbl.talk.far .act { display:none; }
  @keyframes noi { from { transform:scale(.6); opacity:0; } }
  .lbl .card { position:relative; padding:2px; }
  .lbl .card .nm { display:none; padding-right:6px; }
  .lbl:hover .card .nm, .lbl.sel .card .nm { display:inline; }
  .lbl .crown { position:absolute; left:15px; top:-9px; font-size:11px; font-style:normal; }
  .lbl .tag { font-size:9.5px; font-weight:600; color:#cbd5e1; background:rgba(255,255,255,.12); border-radius:4px; padding:0 4px; }
  .lbl.err .card { border-color:var(--err); box-shadow:0 0 10px rgba(239,68,68,.6); }
  .lbl.ghost { opacity:.55; }
  .lbl.sel .card { border-color:var(--acc); box-shadow:0 0 0 2px rgba(255,184,103,.5); }
  .lbl.gd .card { border-color:#f2c14e; background:rgba(59,36,22,.88); } .lbl .boss { font-size:15px; padding-left:4px; }
  .mach { pointer-events:auto; cursor:pointer; font-size:9.5px; padding:1px 5px; border-radius:5px; background:rgba(30,64,175,.75);
    border:1px solid rgba(147,197,253,.4); white-space:nowrap; }
  /* bien ten phong: badge kinh nho o cua kinh, mo khi binh thuong, sang khi re chuot / chon phong */
  .sign { pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:5px; padding:2px 8px 2px 6px; border-radius:999px;
    background:rgba(15,23,42,.55); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(6px); white-space:nowrap; font-weight:600; font-size:10.5px;
    opacity:.55; transform:scale(.92); transition:opacity .2s, transform .2s, border-color .2s, box-shadow .2s; }
  .sign .d { width:6px; height:6px; border-radius:50%; background:#64748b; flex:none; }
  .sign.hot .d { background:var(--run); box-shadow:0 0 6px var(--run); }
  .sign:hover, .sign.hl, .sign.sel { opacity:1; transform:scale(1.06); border-color:rgba(245,158,11,.7); box-shadow:0 0 0 3px rgba(245,158,11,.18), 0 6px 18px rgba(0,0,0,.35); }
  .sign.dong { opacity:.3; }

  /* ho so: ngan keo ben phai */
  #pf { position:fixed; top:calc(var(--topH, 54px) + 26px); right:var(--gap); bottom:var(--gap); width:min(400px, calc(100% - 32px)); padding:16px; overflow:auto;
    transform:translateX(calc(100% + 24px)); transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; scrollbar-width:thin; }
  #pf.open { transform:none; }
  #pf .hd { display:flex; gap:14px; align-items:center; margin:2px 0 12px; padding:12px; border-radius:16px;
    background:linear-gradient(135deg, color-mix(in srgb, var(--c, #64748b) 22%, transparent), rgba(255,255,255,.02)); border:1px solid var(--line); }
  #pf .av { position:relative; flex:none; }
  #pf .hd img { width:72px; height:72px; border-radius:50%; border:3px solid var(--c,#888); background:#2a2a2a; display:block; }
  #pf .av i { position:absolute; right:2px; bottom:2px; width:16px; height:16px; border-radius:50%; background:var(--c, #888); border:3px solid #0f172a; }
  #pf .av i.live { animation:pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow:0 0 0 12px transparent; } }
  #pf h2 { font-size:16px; line-height:1.3; }
  #pf .who { color:var(--dim); font-size:12px; }
  #pf .x { position:absolute; right:10px; top:8px; border:none; background:none; font-size:18px; width:30px; height:30px; padding:0; border-radius:50%; z-index:1; }
  #pf .x:hover { background:rgba(255,255,255,.1); }
  #pf .sec { color:var(--dim); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin:16px 2px 6px; }
  .pills { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .pill { font-size:11px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--line); }
  .pill.chay { background:rgba(34,197,94,.18); border-color:rgba(34,197,94,.4); } .pill.cho { background:rgba(245,158,11,.18); border-color:rgba(245,158,11,.4); }
  .pill.loi { background:rgba(248,113,113,.2); border-color:rgba(248,113,113,.45); }
  .pill.xong { background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.4); } .pill.bo_do { background:rgba(167,139,250,.18); border-color:rgba(167,139,250,.4); }
  .act1 { font-weight:600; margin:10px 0 4px; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .fact { background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:12px; padding:9px 11px;
    box-shadow:0 4px 12px rgba(0,0,0,.18); }
  .fact .l { font-size:10.5px; color:var(--dim); } .fact .v { font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; margin-top:2px; }
  #pf details { margin:8px 0; } #pf summary { cursor:pointer; color:var(--dim); }
  #pf pre { white-space:pre-wrap; word-break:break-word; font:11.5px/1.5 ui-monospace, Menlo, monospace; background:rgba(0,0,0,.3);
    padding:8px; border-radius:10px; max-height:260px; overflow:auto; margin-top:4px; }
  .tl { margin-top:6px; font-size:11.5px; border-radius:12px; border:1px solid var(--line); background:rgba(0,0,0,.18); padding:4px 10px; max-height:300px; overflow:auto; }
  .ev { display:flex; gap:8px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .ev:last-child { border-bottom:0; }
  .ev .tm { color:#93c5fd; flex:none; font:11px/1.6 ui-monospace, Menlo, monospace; }
  .ev .tx b { color:#fde68a; font-weight:600; } .ev.giao .tx::before { content:"● "; color:#f59e0b; } .ev.bao_cao .tx::before { content:"● "; color:#2dd4bf; }
  .ev.cho_duyet .tx::before { content:"● "; color:#c4b5fd; }
  .ev.loi .tx { color:#fca5a5; } .ev code { color:#fcd34d; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }

  #load { position:fixed; inset:0; display:grid; place-items:center; background:#1a1d24; z-index:9; transition:opacity .6s; }
  #load.hide { opacity:0; pointer-events:none; }
  #load p { color:var(--dim); margin-top:8px; text-align:center; }
  #err { color:#fca5a5; white-space:pre-wrap; margin-top:8px; max-width:520px; }
  /* may hat: nut + am luong tren thanh tren; khung YouTube nho goc phai (YouTube yeu cau khung >= 200 px, khong an) */
  #nhacBox { display:flex; gap:6px; align-items:center; }
  #nhacBox button.on { background:rgba(245,158,11,.16); color:#fde7c2; }
  #nhacAm { width:80px; accent-color:var(--acc); display:none; }
  #nhacBox.on #nhacAm, #nhacBox.on #nhacSau { display:inline-block; }
  #nhacSau { display:none; }
  #nhacTen { font-size:11.5px; color:var(--dim); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:none; }
  #nhacBox.on #nhacTen { display:inline; }
  #toast3d { position:fixed; z-index:6; left:50%; top:70px; transform:translateX(-50%); padding:8px 14px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); backdrop-filter:blur(10px); font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast3d.on { opacity:1; }
  #yt { position:fixed; z-index:4; right:12px; bottom:46px; padding:6px; display:none; }
  #yt.on { display:block; }
  #yt .h { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--dim); margin:0 2px 5px; gap:8px; }
  #yt iframe, #ytP { display:block; width:356px; height:200px; border:0; border-radius:8px; }
  @media (max-width: 1500px) { .mp.time { display:none; } }
  @media (max-width: 1100px) { #hint { display:none; } }
  @media (max-width: 760px) { :root { --gap:10px; } #rooms { display:none; } #feedList { max-height:110px; } #nhacTen, #top h1, .mp.time { display:none !important; }
    #yt { left:10px; right:auto; } #top { border-radius:16px; gap:6px; } .mp { padding:2px 7px 2px 6px; font-size:11.5px; }
    #top .tx, .mp .tx { display:none; } #top .sp { display:none; } #top button { padding:4px 8px; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>

<div id="top" class="glass">
