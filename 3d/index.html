<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng AI 3D</title>
<link rel="icon" href="/logo/xuong_64.png">
<!-- Xuong lam viec 3D (Three.js MIT, ky thuat PhongCanh3D): moi kenh mot phong, moi subagent mot nhan vien di lai.
     Ban de chieu man hinh: luon an danh, khong hien noi dung cong viec / lenh / nhat ky. -->
<script type="importmap">
  { "imports": { "three": "/3d/lib/three.module.js", "three/addons/": "/3d/lib/addons/" } }
</script>
<style>
  :root { --ink:#f5efe6; --dim:rgba(245,239,230,.66); --panel:rgba(20,22,28,.72); --line:rgba(255,255,255,.12);
    --run:#22c55e; --wait:#f59e0b; --done:#60a5fa; --err:#ef4444; --ghost:#a78bfa; --acc:#ffb867; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a1d24; color:var(--ink);
    font:13px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  #c { position:fixed; inset:0; display:block; outline:none; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .glass { background:var(--panel); backdrop-filter:blur(12px) saturate(1.3); -webkit-backdrop-filter:blur(12px) saturate(1.3);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
  button { font:inherit; color:inherit; background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:8px;
    padding:5px 10px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.16); }
  button.on { background:rgba(255,184,103,.22); border-color:rgba(255,184,103,.55); color:#ffe2c0; }
  a { color:inherit; }

  /* thanh tren */
  #top { position:fixed; z-index:3; left:12px; right:12px; top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 12px; }
  #top img.brand { width:30px; height:30px; border-radius:50%; margin-right:-4px; }
  #top h1 { font-size:15px; font-weight:650; letter-spacing:.02em; margin-right:4px; white-space:nowrap; }
  #top .sp { flex:1; }
  .stat { display:flex; gap:12px; flex-wrap:wrap; color:var(--dim); }
  .stat b { color:var(--ink); font-weight:650; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  #led { width:8px; height:8px; border-radius:50%; background:#555; }
  #led.on { background:var(--run); box-shadow:0 0 6px var(--run); }
  #led.off { background:var(--err); }
  #rooms { position:fixed; left:12px; top:calc(var(--topH, 54px) + 20px); display:flex; flex-direction:column; gap:4px; max-height:calc(100% - var(--topH, 54px) - 250px); overflow:auto; padding:6px; z-index:2; }
  #rooms button { text-align:left; display:flex; gap:8px; align-items:center; border:none; background:transparent; padding:5px 8px; white-space:nowrap; }
  #rooms button:hover, #rooms button.on { background:rgba(255,255,255,.1); }
  #rooms .n { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; padding-left:10px; }
  #rooms .k { color:var(--dim); font-size:11px; width:14px; }
  #rooms .khoa { margin-left:6px; opacity:.55; font-size:12px; padding:0 2px; border-radius:4px; }
  #rooms .khoa:hover { opacity:1; background:rgba(255,255,255,.15); }
  #rooms .khoa.cho { opacity:.9; filter:grayscale(1); }
  #rooms button.dong { color:var(--dim); }
  .sign.dong { opacity:.45; }

  /* bang tin */
  #feed { position:fixed; left:12px; bottom:12px; width:min(420px, calc(100% - 24px)); padding:8px 10px; max-height:200px; overflow:hidden; }
  #feed .h { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:4px; }
  .fi { display:flex; gap:8px; align-items:flex-start; padding:3px 0; cursor:pointer; }
  .fi.new { animation:fin .5s ease; }
  .fi img { width:20px; height:20px; border-radius:50%; flex:none; background:#333; }
  .fi .t { color:var(--dim); font-variant-numeric:tabular-nums; flex:none; }
  .fi .x, .fi .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @keyframes fin { from { opacity:0; transform:translateY(6px); } }
  #hint { position:fixed; right:12px; bottom:12px; padding:6px 10px; color:var(--dim); font-size:11.5px; max-width:calc(100% - 460px); }

  /* nhan tren dau nhan vien */
  .lbl { pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .lbl .card { display:flex; align-items:center; gap:5px; padding:2px 8px 2px 2px; border-radius:999px; background:rgba(18,20,26,.78);
    border:1px solid rgba(255,255,255,.14); white-space:nowrap; font-size:11.5px; font-weight:600; transition:transform .15s; }
  .lbl:hover .card { transform:scale(1.08); }
  .lbl img { width:22px; height:22px; border-radius:50%; border:2px solid var(--c, #888); background:#2a2a2a; object-fit:cover; }
  .lbl .act { max-width:220px; padding:3px 8px; border-radius:8px; background:rgba(255,255,255,.92); color:#1d1f24; font-size:11px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:none; position:relative; }
  .lbl .act::after { content:""; position:absolute; left:50%; bottom:-4px; margin-left:-4px; border:4px solid transparent; border-bottom:0; border-top-color:rgba(255,255,255,.92); }
  .lbl.near .act, .lbl:hover .act, .lbl.sel .act, .lbl.talk .act { display:block; }
  .lbl.talk .act { white-space:normal; max-width:200px; text-align:center; animation:noi .25s ease-out; }
  .lbl.talk.far .act { display:none; }
  @keyframes noi { from { transform:scale(.6); opacity:0; } }
  .lbl .card { position:relative; padding:2px; }
  .lbl .card .nm { display:none; padding-right:6px; }
  .lbl:hover .card .nm, .lbl.sel .card .nm { display:inline; }
  .lbl .crown { position:absolute; left:15px; top:-9px; font-size:11px; font-style:normal; }
  .lbl .tag { font-size:9.5px; font-weight:600; color:#cbd5e1; background:rgba(255,255,255,.12); border-radius:4px; padding:0 4px; }
  .lbl.err .card { border-color:var(--err); box-shadow:0 0 10px rgba(239,68,68,.6); }
  .lbl.ghost { opacity:.55; }
  .lbl.sel .card { border-color:var(--acc); box-shadow:0 0 0 2px rgba(255,184,103,.5); }
  .lbl.gd .card { border-color:#f2c14e; background:rgba(59,36,22,.88); } .lbl .boss { font-size:15px; padding-left:4px; }
  .mach { pointer-events:auto; cursor:pointer; font-size:9.5px; padding:1px 5px; border-radius:5px; background:rgba(30,64,175,.75);
    border:1px solid rgba(147,197,253,.4); white-space:nowrap; }
  .sign { pointer-events:auto; cursor:pointer; padding:1px 7px; border-radius:6px; background:rgba(18,20,26,.5); border:1px solid rgba(255,255,255,.1);
    white-space:nowrap; font-weight:600; font-size:10.5px; opacity:.85; }
  .sign:hover { opacity:1; }
  .sign.hot { border-color:rgba(34,197,94,.55); }

  /* ho so */
  #pf { position:fixed; top:calc(var(--topH, 54px) + 20px); right:12px; bottom:12px; width:min(420px, calc(100% - 24px)); padding:14px; overflow:auto;
    transform:translateX(calc(100% + 20px)); transition:transform .3s ease; }
  #pf.open { transform:none; }
  #pf .hd { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  #pf .hd img { width:64px; height:64px; border-radius:50%; border:3px solid var(--c,#888); background:#2a2a2a; }
  #pf h2 { font-size:15px; line-height:1.3; }
  #pf .who { color:var(--dim); font-size:12px; }
  #pf .x { position:absolute; right:10px; top:8px; border:none; background:none; font-size:18px; }
  .pills { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.1); }
  .pill.chay { background:rgba(34,197,94,.25); } .pill.cho { background:rgba(245,158,11,.25); } .pill.loi { background:rgba(239,68,68,.3); }
  .pill.xong { background:rgba(96,165,250,.25); } .pill.bo_do { background:rgba(167,139,250,.25); }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0; }
  .fact { background:rgba(255,255,255,.06); border-radius:8px; padding:6px 8px; }
  .fact .l { font-size:10.5px; color:var(--dim); } .fact .v { font-weight:650; }
  #pf details { margin:8px 0; } #pf summary { cursor:pointer; color:var(--dim); }
  #pf pre { white-space:pre-wrap; word-break:break-word; font:11.5px/1.5 ui-monospace, Menlo, monospace; background:rgba(0,0,0,.25);
    padding:8px; border-radius:8px; max-height:260px; overflow:auto; margin-top:4px; }
  .tl { margin-top:6px; font-size:11.5px; }
  .ev { display:flex; gap:8px; padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .ev .tm { color:var(--dim); flex:none; font-variant-numeric:tabular-nums; }
  .ev.loi .tx { color:#fca5a5; } .ev code { color:#fcd34d; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }

  #load { position:fixed; inset:0; display:grid; place-items:center; background:#1a1d24; z-index:9; transition:opacity .6s; }
  #load.hide { opacity:0; pointer-events:none; }
  #load p { color:var(--dim); margin-top:8px; text-align:center; }
  #err { color:#fca5a5; white-space:pre-wrap; margin-top:8px; max-width:520px; }
  @media (max-width: 760px) { #rooms, #hint { display:none; } #feed { max-height:120px; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>

<div id="top" class="glass">
  <span id="led"></span><img class="brand" src="/logo/xuong_tron.png" alt=""><h1 id="xuongName">Văn phòng AI</h1>
  <div class="stat" id="stat"></div>
  <span class="sp"></span>
  <button id="btnKt" title="Phím K: Sếp tự đi một vòng kiểm tra, máy quay góc nhìn thứ ba">🚶 Sếp đi kiểm tra</button>
  <button id="btnAll" title="Phím 0">Toàn cảnh</button>
  <button id="btnWall" title="Phím T: hạ/dựng tường">Tường thấp</button>
  <button id="btnQ" title="Chất lượng hình">Vừa</button>
  <a id="demoA" href="/3d?demo=1" title="Thêm nhân viên giả để xem đi lại, nộp hồ sơ"><button id="demoBtn">🎬 Chạy thử</button></a>
  <a href="/"><button>Bản 2D</button></a>
</div>
<div id="rooms" class="glass"></div>
<div id="feed" class="glass"><div class="h">Bảng tin</div><div id="feedList"></div></div>
<div id="hint" class="glass">Kéo: xoay · chuột phải: dời · cuộn: gần/xa · bấm người: hồ sơ · nhấp đúp: bám theo · 1–9: phòng · Esc: thôi</div>

<aside id="pf" class="glass"><button class="x" id="pfX" aria-label="Đóng">×</button><div id="pfBody"></div></aside>

<div id="load"><div><div style="font-size:18px;text-align:center">🏗️ Đang xây văn phòng…</div><p id="loadMsg">nạp Three.js</p><div id="err"></div></div></div>

<script src="/chung.js"></script>
<script type="module" src="/3d/van_phong.js"></script>
</body>
</html>
